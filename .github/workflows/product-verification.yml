name: product-verification
on:
  pull_request:
  push:
    branches: [codex/finish-seekerh]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run verify
      - run: docker build -t product-verification:ci .

